<text x="112" y="182.5" textLength="774" lengthAdjust="spacingAndGlyphs">There is no server to run: 'D:\servers\survival\bedrock_server_mod.exe' is not a file,</text>
<text x="58" y="202.5" textLength="792" lengthAdjust="spacingAndGlyphs">though the workspace has the game bds 1.26.60 with a loader. It may have been deleted or</text>
<text x="58" y="222.5" textLength="810" lengthAdjust="spacingAndGlyphs">moved by hand. lip does not install a package again that is installed in the same version,</text>
<text x="58" y="242.5" textLength="828" lengthAdjust="spacingAndGlyphs">so setting up the same versions here does not bring the file back. Restore it from a backup,</text>
<text x="58" y="262.5" textLength="801" lengthAdjust="spacingAndGlyphs">or run 'lip setup --game 1.26.60 --loader levilamina@26.60.3' in an empty folder and copy</text>
<text x="58" y="282.5" textLength="180" lengthAdjust="spacingAndGlyphs">the file from there.</text>
