<text x="58" y="182.5" textLength="54" lengthAdjust="spacingAndGlyphs" fill="#f07178" font-weight="700">error:</text>
<text x="121" y="182.5" textLength="720" lengthAdjust="spacingAndGlyphs">There is no server to run: 'D:\servers\survival\bedrock_server_mod.exe' is not a</text>
<text x="58" y="202.5" textLength="819" lengthAdjust="spacingAndGlyphs">file, though the workspace has the game bds 1.26.60 with a loader. It may have been deleted</text>
<text x="58" y="222.5" textLength="756" lengthAdjust="spacingAndGlyphs">or moved by hand. lip does not install a package again that is installed in the same</text>
<text x="58" y="242.5" textLength="819" lengthAdjust="spacingAndGlyphs">version, so setting up the same versions here does not bring the file back. Restore it from</text>
<text x="58" y="262.5" textLength="810" lengthAdjust="spacingAndGlyphs">a backup, or run 'lip setup --game 1.26.60 --loader levilamina@26.60.3' in an empty folder</text>
<text x="58" y="282.5" textLength="261" lengthAdjust="spacingAndGlyphs">and copy the file from there.</text>
<text x="58" y="322.5" textLength="108" lengthAdjust="spacingAndGlyphs" fill="#8b95a7">Full report:</text>
<text x="175" y="322.5" textLength="495" lengthAdjust="spacingAndGlyphs" fill="#56c8d8" font-weight="700">D:\servers\survival\.lip\logs\20261114T201502Z-4120.log</text>
