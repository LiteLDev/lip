$schema: https://json-schema.org/draft-07/schema#
$id: https://github.com/LiteLDev/lip/raw/main/specs/schemas/manifest.schema.yaml
title: lip manifest.json (format bf45b1)
description: >-
  A manifest.json of format "bf45b1": a package document, or a meta document (with "targets")
  pointing to other packages. Keys not described here are ignored. LeviLamina manifests without
  the "format" key are also read by lip, but they are outside this schema. Not expressible here:
  two targets with the same variant must not write the same selector keys with intersecting
  values; the keys of a package document must not be null; and the "from" of every file must be
  a key of "archives".
type: object
properties:
  format:
    type: string
    const: bf45b1
required: [format]
oneOf:
  - $ref: '#/definitions/metaDocument'
  - $ref: '#/definitions/packageDocument'
definitions:
  semVer:
    type: string
    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
  id:
    type: string
    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
  variant:
    type: string
    pattern: ^[a-z0-9_]+(/[a-z0-9_]+)?$
  platform:
    type: string
    enum: [server, client]
  ref:
    description: >-
      target [ "#" variant ], where target is a relative path starting with "./" (pointing to a
      directory when it ends with "/"), an https URL, or a Go module path
      (golang.org/x/mod/module.CheckPath; the pattern checks only its general shape). A Go module
      path may be followed by [ "@" git-ref ] after the variant, pinning it to one commit:
      "branch:<name>", "tag:<name>" or "rev:<40-digit commit id>".
    type: string
    pattern: ^(?:\./(?!.*@(?:branch|tag|rev):)(?!\.\.?(?:/|#|$))[^/#\\]+(?:/(?!\.\.?(?:/|#|$))[^/#\\]+)*/?(?:#[a-z0-9_]+(?:/[a-z0-9_]+)?)?|https://(?!.*@(?:branch|tag|rev):)[^#]+(?:#[a-z0-9_]+(?:/[a-z0-9_]+)?)?|(?=[a-z0-9.-]*\.)[a-z0-9](?:[a-z0-9.-]*[a-z0-9-])?(?:/[A-Za-z0-9_~{}-](?:[A-Za-z0-9._~{}-]*[A-Za-z0-9_~{}-])?)*(?:#[a-z0-9_]+(?:/[a-z0-9_]+)?)?(?:@(?:branch:(?!/|@$)(?!.*(?:\.\.|@\{|//|/\.|\.lock(?:/|$)|[/.]$))[^\u0000- \u007f~^:?*\[\\]+|tag:(?!/|@$)(?!.*(?:\.\.|@\{|//|/\.|\.lock(?:/|$)|[/.]$))[^\u0000- \u007f~^:?*\[\\]+|rev:[0-9a-fA-F]{40}))?)$
  source:
    description: One ref, or alternatives in order.
    oneOf:
      - $ref: '#/definitions/ref'
      - type: array
        minItems: 1
        items:
          $ref: '#/definitions/ref'
  templateRef:
    description: A ref that may contain {{id}}, {{version}}, {{platform}} and {{runtime}}.
    type: string
    not:
      pattern: \{\{(?!(id|version|platform|runtime)\}\})
  range:
    description: >-
      A node-semver range (semver.satisfies without the loose and includePrerelease options). A
      full version without an operator matches exactly that version.
    type: string
  glob:
    description: >-
      POSIX fnmatch patterns with FNM_PATHNAME and without FNM_PERIOD, matched segment by segment
      ('*', '?', bracket expressions; no escape character); a '**' segment matches zero or more
      segments; a trailing '/' matches directories and everything below them.
    type: string
    pattern: ^(?!/)(?!.*//)[^\\]+$
  globs:
    type: array
    items:
      $ref: '#/definitions/glob'
  commands:
    type: array
    items:
      type: string
  path:
    type: string
    pattern: ^(?!/)(?![A-Za-z]:)(?!.*//)(?!(.*/)?\.\.(/|$))[^\\]*$
  info:
    type: object
    properties:
      name:
        type: string
      description:
        type: string
      authors:
        type: array
        items:
          type: string
      tags:
        type: array
        items:
          type: string
      icon:
        type: string
        pattern: ^https://
  dependency:
    oneOf:
      - $ref: '#/definitions/range'
      - type: object
        properties:
          version:
            $ref: '#/definitions/range'
          source:
            $ref: '#/definitions/source'
          mod:
            type: boolean
        if:
          properties:
            mod:
              const: false
          required: [mod]
        then:
          required: [source]
  dependencies:
    type: object
    propertyNames:
      $ref: '#/definitions/id'
    additionalProperties:
      $ref: '#/definitions/dependency'
  conflicts:
    type: object
    propertyNames:
      $ref: '#/definitions/id'
    additionalProperties:
      $ref: '#/definitions/range'
  loadOrder:
    type: array
    items:
      anyOf:
        - const: '*'
        - $ref: '#/definitions/id'
  mod:
    type: object
    properties:
      loader:
        type: string
        minLength: 1
      entry:
        type: string
        minLength: 1
      passive:
        type: boolean
      loadAfter:
        $ref: '#/definitions/loadOrder'
      loadBefore:
        $ref: '#/definitions/loadOrder'
      extra:
        type: object
    required: [loader, entry]
  file:
    type: object
    properties:
      from:
        $ref: '#/definitions/id'
      src:
        $ref: '#/definitions/path'
      dest:
        $ref: '#/definitions/path'
    required: [src, dest]
    oneOf:
      - description: 'Glob form: src contains "*", "?" or "[".'
        properties:
          src:
            pattern: '[*?\[]'
          dest:
            pattern: (^|/)$
      - description: 'Directory form: "" or a trailing "/".'
        properties:
          src:
            pattern: ^[^*?\[]*$
            not:
              pattern: '[^/]$'
          dest:
            pattern: (^|/)$
      - description: File form.
        properties:
          src:
            pattern: ^[^*?\[]*[^/*?\[]$
          dest:
            pattern: '[^/]$'
  archive:
    type: object
    properties:
      url:
        oneOf:
          - type: string
            pattern: ^https://
          - type: array
            minItems: 1
            items:
              type: string
              pattern: ^https://
      sha256:
        type: string
        pattern: ^[0-9a-fA-F]{64}$
      format:
        enum: [zip, tar, tgz, file]
    required: [url]
  archives:
    type: object
    propertyNames:
      $ref: '#/definitions/id'
    additionalProperties:
      $ref: '#/definitions/archive'
  hooks:
    type: object
    properties:
      preInstall:
        $ref: '#/definitions/commands'
      postInstall:
        $ref: '#/definitions/commands'
      preUninstall:
        $ref: '#/definitions/commands'
      postUninstall:
        $ref: '#/definitions/commands'
  packageKeys:
    description: The keys of a package document, all of which a target may override.
    properties:
      id:
        $ref: '#/definitions/id'
      version:
        $ref: '#/definitions/semVer'
      platform:
        $ref: '#/definitions/platform'
      runtime:
        type: string
      info:
        $ref: '#/definitions/info'
      dependencies:
        $ref: '#/definitions/dependencies'
      conflicts:
        $ref: '#/definitions/conflicts'
      mod:
        $ref: '#/definitions/mod'
      files:
        type: array
        items:
          $ref: '#/definitions/file'
      archives:
        $ref: '#/definitions/archives'
      preserve:
        $ref: '#/definitions/globs'
      remove:
        $ref: '#/definitions/globs'
      hooks:
        $ref: '#/definitions/hooks'
  target:
    type: object
    properties:
      variant:
        anyOf:
          - const: ''
          - $ref: '#/definitions/variant'
      platform:
        oneOf:
          - $ref: '#/definitions/platform'
          - type: array
            minItems: 1
            items:
              $ref: '#/definitions/platform'
      runtime:
        oneOf:
          - type: string
          - type: array
            minItems: 1
            items:
              type: string
      source:
        description: Alternatives in order.
        oneOf:
          - $ref: '#/definitions/templateRef'
          - type: array
            minItems: 1
            items:
              $ref: '#/definitions/templateRef'
      id:
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/id'
      version:
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/semVer'
      info:
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/info'
      dependencies:
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/dependencies'
      conflicts:
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/conflicts'
      mod:
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/mod'
      files:
        oneOf:
          - type: 'null'
          - type: array
            items:
              $ref: '#/definitions/file'
      archives:
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/archives'
      preserve:
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/globs'
      remove:
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/globs'
      hooks:
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/hooks'
    required: [source]
  metaDocument:
    description: >-
      Only id and version are used in resolution (in templates); the other keys are the template
      packing completes with a target.
    properties:
      id:
        $ref: '#/definitions/id'
      version:
        $ref: '#/definitions/semVer'
      targets:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/target'
    required: [targets]
  packageDocument:
    allOf:
      - $ref: '#/definitions/packageKeys'
      - not:
          anyOf:
            - required: [mod, files]
            - required: [mod, archives]
    not:
      required: [targets]
    required: [id, version]
