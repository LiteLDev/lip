$schema: https://json-schema.org/draft-07/schema#
title: lip workspace lock (<workspace>/.lip/lock.json), format bf45b1
type: object
properties:
  format:
    type: string
    const: bf45b1
  platform:
    description: >-
      Environment platform. lip manages server workspaces only and writes "server"; null in a lock
      migrated from tooth_lock.json. A lock recording another platform makes workspace operations
      fail.
    enum: [server, client, null]
  runtime:
    description: .NET RID of the environment; null until known.
    type: [string, 'null']
    minLength: 1
  packages:
    type: array
    items:
      $ref: '#/definitions/package'
required: [format, packages]
definitions:
  package:
    type: object
    properties:
      id:
        description: >-
          Identity: the id of the package; for a tooth.json package, the tooth name followed by
          "-<label>" for a labelled variant.
        type: string
      version:
        type: string
      kind:
        description: >-
          Package kind: "mcmod" for a manifest.json (of format bf45b1, or a LeviLamina manifest),
          "tooth" for a tooth.json.
        type: string
      explicit:
        description: Whether the user asked for the package (as opposed to a dependency).
        type: boolean
      chain:
        description: >-
          Resolution chain: the ref of every hop and the target index chosen at that hop. The first
          ref is what `lip update` requests again.
        type: array
        items:
          type: object
          properties:
            ref:
              description: >-
                The ref as resolved, including a git ref (e.g. "github.com/o/r@branch:main"); the
                first hop may also be the file: URI of a local ZIP file requested by the user.
              type: string
            target:
              description: >-
                Index of the target selected in the meta document at this hop; null when the hop
                reaches a package document.
              type: [integer, 'null']
              minimum: 0
            commit:
              description: >-
                For a spec ref: the commit its archive was at (the version tag's commit, or the
                commit the git ref resolved to). Absent for other refs and in entries migrated from
                tooth_lock.json.
              type: string
              pattern: ^[0-9a-f]{40}$
          required: [ref, target]
      archiveKey:
        type: string
      archive:
        description: Identity of the final archive; null for packages migrated from tooth_lock.json.
        oneOf:
          - type: 'null'
          - $ref: '#/definitions/zipArchive'
          - $ref: '#/definitions/gitArchive'
      files:
        description: >-
          Owned files, workspace-relative and '/'-separated; files under plugins/ are recorded in
          the mods/ form.
        type: array
        items:
          type: string
      manifest:
        description: >-
          The package document: the manifest.json (of format bf45b1, or a LeviLamina manifest), or
          for a tooth.json package the tooth.json in format 3 with the version installed.
        type: object
    required: [id, version, kind, explicit, chain, archiveKey, manifest]
  zipArchive:
    type: object
    properties:
      kind:
        const: zip
      sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      url:
        description: >-
          Where the ZIP file was read from: the https URL it was downloaded from, the file: URI of a
          local file, or null for a ZIP file nested in another archive.
        type: [string, 'null']
      path:
        description: >-
          The directory inside the ZIP file that is the package's archive root, when the package is
          a directory of it.
        type: string
    required: [kind, sha256, url]
  gitArchive:
    type: object
    properties:
      kind:
        const: git
      repo:
        type: string
      commit:
        type: string
      path:
        description: Path of the archive root in the repository; "" for the root.
        type: string
    required: [kind, repo, commit, path]
