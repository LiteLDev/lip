on:
  pull_request:
    paths:
      - .github/workflows/build-docs.yml
      - docs/**
  push:
    paths:
      - .github/workflows/build-docs.yml
      - docs/**
  workflow_dispatch:

jobs:
  build-docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the "Last updated" dates

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json # pnpm version from "packageManager"

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
          node-version: 24

      - working-directory: docs
        run: |
          pnpm install --frozen-lockfile

      - working-directory: docs
        run: |
          pnpm build

      - working-directory: docs
        run: |
          pnpm linkcheck

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
