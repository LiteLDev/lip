on:
  pull_request:
    paths: &paths
      - .github/workflows/build-docs.yml
      - docs/**
  push:
    paths: *paths
  # levimc-kit (the LeviMC bar, footer and docs engine) is fetched by the package install: levimc.org triggers this
  # workflow when it publishes a new kit.
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the "Last updated" dates

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json # pnpm version from "packageManager"

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
          node-version: 24

      - run: pnpm install --frozen-lockfile
      # type-check docs.config.ts (and the kit) first: a config that does not parse fails the pull request clearly
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm linkcheck

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-docs
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
