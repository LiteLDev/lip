# Releases a version: run it from main (the workflow file on main drives every release line).
#
# - X.Y.0 from main: releases main and starts the release/X.Y line at the release commit.
# - X.Y.0 from a release/A.B branch: starts the release/X.Y line from that branch and releases it, for a feature
#   release while main is not ready to ship.
# - X.Y.Z (Z > 0) from release/X.Y: a bugfix release of that line.
#
# It tags the branch tip and creates a draft release with notes generated from the pull requests since the previous
# release on the branch. The build and publishing run with the release.yml of the released tag, so each line keeps
# its own pipeline.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 1.2.3)
        required: true
      branch:
        description: Branch to release from (main, or a release/X.Y branch)
        required: true
        default: main

concurrency:
  group: create-release

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
    steps:
      - id: plan
        run: |
          fail() { echo "::error::$1"; exit 1; }

          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]] \
            || fail "$VERSION is not a version like 1.2.3 or 1.2.3-beta.1"
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          prerelease="${BASH_REMATCH[4]}"
          line="release/$minor"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            fail "v$VERSION already exists"
          fi
          gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --silent 2>/dev/null \
            || fail "Branch $BRANCH does not exist"
          line_exists=$(gh api "repos/$GITHUB_REPOSITORY/branches/$line" --silent 2>/dev/null && echo true || echo false)

          newest=$(
            gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
              | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' \
              | sort -V \
              | tail -1
          )

          start_line=false
          if [[ "$patch" != 0 ]]; then
            [[ "$BRANCH" == "$line" ]] || fail "A bugfix release of $minor is made from $line, not $BRANCH"
          elif [[ "$BRANCH" != main && "$BRANCH" != "$line" ]]; then
            [[ "$BRANCH" == release/* ]] || fail "Release from main or a release/X.Y branch, not $BRANCH"
            [[ -z "$prerelease" ]] || fail "A prerelease of a new line is made from main"
            [[ "$line_exists" == false ]] || fail "$line already exists: release $minor.0 from it"
            start_line=true
          elif [[ "$BRANCH" == main && -z "$prerelease" ]]; then
            [[ "$line_exists" == false ]] || fail "$line already exists: release $minor.0 from it"
            start_line=true
          fi

          if [[ "$patch" == 0 && -z "$prerelease" && -n "$newest" ]]; then
            [[ "$(printf '%s\n' "$newest" "$VERSION" | sort -V | tail -1)" == "$VERSION" ]] \
              || fail "$VERSION is not newer than the newest release $newest"
          fi

          {
            echo "line=$line"
            echo "start-line=$start_line"
          } >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # The notes list the commits since the newest stable release the branch contains, which skips releases of other
      # lines, by their Conventional Commits type.
      - id: tag
        run: |
          sha=$(git rev-parse HEAD)
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*-*' HEAD 2>/dev/null || true)
          log=$(git log --no-merges --format=%s ${previous:+"$previous..HEAD"})

          section() {
            local lines
            lines=$(grep -E "$2" <<< "$log" || true)
            if [[ -n "$lines" ]]; then
              printf '### %s\n\n%s\n\n' "$1" "$(awk '{ print "- " $0 }' <<< "$lines")"
            fi
          }
          {
            section 'Breaking changes' '^[a-z]+(\([^)]*\))?!: '
            section 'Features' '^feat(\([^)]*\))?: '
            section 'Bug fixes' '^fix(\([^)]*\))?: '
            if [[ -n "$previous" ]]; then
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...v$VERSION"
            fi
          } > "$RUNNER_TEMP/notes.md"

          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$sha" --silent
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}

      - if: steps.plan.outputs.start-line == 'true'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$LINE" -f sha="$SHA" --silent
          gh label create "backport $LINE" \
            --repo "$GITHUB_REPOSITORY" \
            --color c5def5 \
            --description "Backport to $LINE after merging" \
            --force
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ steps.plan.outputs.line }}
          SHA: ${{ steps.tag.outputs.sha }}

      - run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "v$VERSION" \
            -f tag="v$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
