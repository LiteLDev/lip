# No paths filter: ci-ok is a required check, and a required check must report on every pull
# request, docs-only ones included. A merge queue does not support paths filters either. Instead,
# the job changes decides which jobs the change needs, and the others are skipped.
# Pushes to main are not tested: merge_group already tests the exact commit that lands on main.
# Pushes to release/** still are, since they do not go through the merge queue.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides which jobs to run from the files the pull request or merge group changes. A change to
  # this workflow runs every job; a change to src, or to what every project builds with, every job
  # but install, which installs a released lip; a change to tests runs lint and test; a change to
  # install.sh runs build, e2e, lint and install; a change to packaging runs build and e2e, and one to
  # .github/scripts, which e2e runs, build, e2e and lint; a change to .editorconfig runs lint; any
  # other change, like one to the docs or protocol, runs none. Pushes and manual runs run every
  # job. e2e runs whenever build does.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
      install: ${{ steps.changes.outputs.install }}
      lint: ${{ steps.changes.outputs.lint }}
      test: ${{ steps.changes.outputs.test }}
    steps:
      # The commit of a pull request merges it into main; its first parent is main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: changes
        shell: bash
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group)
              base=$MERGE_GROUP_BASE_SHA
              git fetch --no-tags --depth=1 origin "$base"
              ;;
            *) base= ;;
          esac

          build=false install=false lint=false test=false
          if [ -z "$base" ]; then
            build=true install=true lint=true test=true
          else
            # Without renames, a file moved out of src is listed under its old path too.
            while IFS= read -r file; do
              echo "$file"
              case "$file" in
                .github/workflows/ci.yml) build=true install=true lint=true test=true ;;
                src/* | lip.slnx | global.json | [Nn]u[Gg]et.config | Directory.*)
                  build=true lint=true test=true ;;
                tests/*) lint=true test=true ;;
                install.sh) build=true install=true lint=true ;;
                packaging/*) build=true ;;
                .github/scripts/*) build=true lint=true ;;
                .editorconfig) lint=true ;;
              esac
            done < <(git diff --name-only --no-renames "$base" HEAD)
          fi

          echo "build=$build install=$install lint=$lint test=$test"
          {
            echo "build=$build"
            echo "install=$install"
            echo "lint=$lint"
            echo "test=$test"
          } >> "$GITHUB_OUTPUT"

  # lip is not built for Linux on arm64: no Wine there runs a LeviLamina server (see the
  # job e2e).
  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      # Self-contained: lip needs no .NET runtime where it runs.
      - run: dotnet publish src/Lip.Cli -o bin -r ${{ matrix.runtime }} --self-contained -p:DebugType=embedded

      # The tests that run lip as a program, with the lip published above: trimmed, as released.
      - shell: bash
        run: |
          dir=$(cd bin && { pwd -W 2>/dev/null || pwd; })
          LIP_TEST_EXECUTABLE="$dir/$(ls bin | grep -E '^lip(\.exe)?$')" \
            dotnet test tests/Lip.Cli.Tests --filter FullyQualifiedName~UsageErrorTests

      - uses: actions/upload-artifact@v7
        with:
          name: lip-${{ github.sha }}-${{ matrix.runtime }}
          path: bin/

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - run: dotnet format --verify-no-changes

      # install.sh runs in any POSIX shell (#!/bin/sh), so ShellCheck checks it as sh. The scripts
      # of .github/scripts are checked as their first lines say.
      - run: shellcheck install.sh .github/scripts/*.sh

      # Code style and the .NET analyzers at build time, with every warning failing the build.
      - run: dotnet build -warnaserror -p:EnforceCodeStyleInBuild=true

  # The end-to-end test, on every system lip is released for: installs the lip that was built the
  # way a user does, sets up the newest game that LeviLamina supports with LeviLamina, runs the
  # server, has it answer list and stop, and checks that lip run exits with 0
  # (.github/scripts/e2e-server.sh). Where the system is not Windows, the Wine that lip installs
  # runs the server.
  #
  # - Linux: in a new container of each distribution below, where install.sh, run as in
  #   curl -fsSL https://levimc.org/lip/install.sh | sh, installs lip, and a user without root runs
  #   it. Only what install.sh needs is installed first, curl and xz
  #   (.github/scripts/e2e-linux-container.sh).
  # - macOS: install.sh installs lip, and a new standard user, not an administrator, runs it.
  # - Windows: the Windows Installer package of lip installs it. It installs for every user, so it
  #   needs an administrator, as the user of the runner is; lip then runs from the PATH that the
  #   package set.
  #
  # install.sh downloads the lip that was built, as the archive of a release v0.0.0-ci, from a
  # local server that LIP_GITHUB_PROXY points it to.
  #
  # Linux on arm64 is not among them. There, Hangover runs the server of Minecraft, but not the
  # one LeviLamina has modified; the Wine for x64 loses the exit codes of Windows programs under
  # box64, and under FEX ran a LeviLamina server in two of six attempts: PeEditor.exe was killed
  # in two, and the server failed as it stopped in two.
  e2e:
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true'
    name: e2e (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64, ubuntu:latest
            runtime: linux-x64
            runs-on: ubuntu-latest
            image: ubuntu:latest
          - name: linux-x64, debian:stable-slim
            runtime: linux-x64
            runs-on: ubuntu-latest
            image: debian:stable-slim
          - name: osx-arm64
            runtime: osx-arm64
            runs-on: macos-latest
          - name: osx-x64
            runtime: osx-x64
            runs-on: macos-15-intel
          - name: win-arm64
            runtime: win-arm64
            runs-on: windows-11-arm
          - name: win-x64
            runtime: win-x64
            runs-on: windows-latest
    env:
      LIP_VERSION: 0.0.0-ci
      LIP_GITHUB_PROXY: http://127.0.0.1:8765/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lip-${{ github.sha }}-${{ matrix.runtime }}
          path: bin

      # The archive and SHA256SUMS of the release v0.0.0-ci, at the paths that install.sh requests
      # through LIP_GITHUB_PROXY, served by a local server.
      - if: runner.os != 'Windows'
        run: |
          chmod +x bin/lip
          release="$RUNNER_TEMP/proxy/https:/github.com/LiteLDev/lip/releases/download/v$LIP_VERSION"
          mkdir -p "$release"
          name=lip-$LIP_VERSION-${{ matrix.runtime }}
          if [ "$RUNNER_OS" = Linux ]; then
            tar -cJf "$release/$name.tar.xz" -C bin .
          else
            (cd bin && zip -qr9 "$release/$name.zip" .)
          fi
          (cd "$release" && shasum -a 256 lip-* > SHA256SUMS)
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/proxy" \
            > "$RUNNER_TEMP/proxy.log" 2>&1 &

      - if: runner.os == 'Linux'
        run: |
          docker run --rm --network host -v "$PWD:/repo:ro" \
            -e LIP_VERSION -e LIP_GITHUB_PROXY \
            ${{ matrix.image }} sh /repo/.github/scripts/e2e-linux-container.sh

      # sysadminctl makes a standard user unless given -admin.
      - if: runner.os == 'macOS'
        run: |
          sudo sysadminctl -addUser player -password "$(openssl rand -hex 16)"
          sudo createhomedir -c -u player > /dev/null
          # The checkout is in the home of the runner's user, which player cannot read.
          repo=$(mktemp -d /tmp/repo.XXXXXX)
          cp install.sh .github/scripts/e2e-server.sh "$repo"
          chmod -R a+rX "$repo"
          sudo -u player -H env LIP_VERSION="$LIP_VERSION" LIP_GITHUB_PROXY="$LIP_GITHUB_PROXY" \
            bash -c 'cd && sh < "$1/install.sh" && bash "$1/e2e-server.sh" "$HOME/.local/bin/lip"' \
            _ "$repo"

      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = '${{ matrix.runtime }}' -replace '^win-'
          ./packaging/wix/build.ps1 -Version $env:LIP_VERSION -Arch $arch -BinDir bin -OutDir dist
          $msi = Resolve-Path "dist/lip-$env:LIP_VERSION-win-$arch.msi"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi.log'
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 50; throw "msiexec exited with $($p.ExitCode)" }
          # A new shell would find lip on the PATH that the package set.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $lip = (Get-Command lip -CommandType Application).Source
          "LIP=$lip" >> $env:GITHUB_ENV

      - if: runner.os == 'Windows'
        shell: bash
        run: bash .github/scripts/e2e-server.sh "$(cygpath -u "$LIP")"

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ${{ matrix.runs-on }}
    # The tests take minutes. A test that never ends must not hold a runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-24.04-arm
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-11-arm
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      # When no test ends within ten minutes, the tests that were running are named and the
      # job fails.
      - run: dotnet test --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none

  # Installs the latest release of lip with install.sh, as curl -fsSL .../install.sh | sh does,
  # without changing PATH, and runs it.
  install:
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7

      - run: |
          dir=$(mktemp -d)
          LIP_INSTALL_DIR="$dir" LIP_NO_MODIFY_PATH=1 sh install.sh < /dev/null
          "$dir/lip" -v

  # The single check that the ruleset of main requires: it fails unless every job the change
  # needs succeeded, so the ruleset need not name each job of each matrix. It checks each job
  # against what the change needs, not only for a failure: a job skipped as a job it needs did not
  # succeed, or whose runner never came, does not report a failure.
  ci-ok:
    needs: [changes, build, e2e, install, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          # job=result:needed, one per line.
          RESULTS: |
            changes=${{ needs.changes.result }}:true
            build=${{ needs.build.result }}:${{ needs.changes.outputs.build }}
            e2e=${{ needs.e2e.result }}:${{ needs.changes.outputs.build }}
            install=${{ needs.install.result }}:${{ needs.changes.outputs.install }}
            lint=${{ needs.lint.result }}:${{ needs.changes.outputs.lint }}
            test=${{ needs.test.result }}:${{ needs.changes.outputs.test }}
        run: |
          status=0
          for entry in $RESULTS; do
            job=${entry%%=*}
            result=${entry#*=}
            needed=${result#*:}
            result=${result%%:*}
            echo "$job: $result"
            if [ "$needed" = true ] && [ "$result" != success ]; then
              echo "::error::The change needs $job, which did not succeed: $result."
              status=1
            fi
          done
          exit $status
