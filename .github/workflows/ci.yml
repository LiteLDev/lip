# No paths filter: ci-ok is a required check, and a required check must report on every pull
# request, docs-only ones included. A merge queue does not support paths filters either. Instead,
# the job changes decides which jobs the change needs, and the others are skipped.
# Pushes to main are not tested: merge_group already tests the exact commit that lands on main.
# Pushes to release/** still are, since they do not go through the merge queue.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides which jobs to run from the files the pull request or merge group changes. A change to
  # this workflow runs every job; a change to src, or to what every project builds with, every job
  # but install, which installs a released lip; a change to tests runs lint and test; a change to
  # install.sh runs lint and install; a change to .editorconfig runs lint; any other change, like
  # one to the docs, protocol or packaging, runs none. Pushes and manual runs run every job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
      install: ${{ steps.changes.outputs.install }}
      lint: ${{ steps.changes.outputs.lint }}
      test: ${{ steps.changes.outputs.test }}
    steps:
      # The commit of a pull request merges it into main; its first parent is main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: changes
        shell: bash
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group)
              base=$MERGE_GROUP_BASE_SHA
              git fetch --no-tags --depth=1 origin "$base"
              ;;
            *) base= ;;
          esac

          build=false install=false lint=false test=false
          if [ -z "$base" ]; then
            build=true install=true lint=true test=true
          else
            # Without renames, a file moved out of src is listed under its old path too.
            while IFS= read -r file; do
              echo "$file"
              case "$file" in
                .github/workflows/ci.yml) build=true install=true lint=true test=true ;;
                src/* | lip.slnx | global.json | [Nn]u[Gg]et.config | Directory.*)
                  build=true lint=true test=true ;;
                tests/*) lint=true test=true ;;
                install.sh) install=true lint=true ;;
                .editorconfig) lint=true ;;
              esac
            done < <(git diff --name-only --no-renames "$base" HEAD)
          fi

          echo "build=$build install=$install lint=$lint test=$test"
          {
            echo "build=$build"
            echo "install=$install"
            echo "lint=$lint"
            echo "test=$test"
          } >> "$GITHUB_OUTPUT"

  # lip is not built for Linux on arm64: no Wine there runs a LeviLamina server (see the
  # job server).
  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      # Self-contained: lip needs no .NET runtime where it runs.
      - run: dotnet publish src/Lip.Cli -o bin -r ${{ matrix.runtime }} --self-contained -p:DebugType=embedded

      # The tests that run lip as a program, with the lip published above: trimmed, as released.
      - shell: bash
        run: |
          dir=$(cd bin && { pwd -W 2>/dev/null || pwd; })
          LIP_TEST_EXECUTABLE="$dir/$(ls bin | grep -E '^lip(\.exe)?$')" \
            dotnet test tests/Lip.Cli.Tests --filter FullyQualifiedName~UsageErrorTests

      - uses: actions/upload-artifact@v7
        with:
          name: lip-${{ github.sha }}-${{ matrix.runtime }}
          path: bin/

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - run: dotnet format --verify-no-changes

      # install.sh runs in any POSIX shell (#!/bin/sh), so ShellCheck checks it as sh.
      - run: shellcheck install.sh

      # Code style and the .NET analyzers at build time, with every warning failing the build.
      - run: dotnet build -warnaserror -p:EnforceCodeStyleInBuild=true

  # Installs LeviLamina and runs the real server with the lip that was built, on every system
  # lip is released for. Where the system is not Windows, the Wine that lip installs runs the
  # server.
  #
  # Linux on arm64 is not among them. There, Hangover runs the server of Minecraft, but not the
  # one LeviLamina has modified; the Wine for x64 loses the exit codes of Windows programs under
  # box64, and under FEX ran a LeviLamina server in two of six attempts: PeEditor.exe was killed
  # in two, and the server failed as it stopped in two.
  server:
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lip-${{ github.sha }}-${{ matrix.runtime }}
          path: bin

      # lip installs Wine and the Visual C++ runtime itself. Wine for macOS is built for x64 only:
      # Rosetta runs it, which lip does not install, since that needs an administrator.
      - if: matrix.runtime == 'osx-arm64'
        run: softwareupdate --install-rosetta --agree-to-license

      - shell: bash
        run: chmod +x bin/lip* || true

      # Sets up the newest game that LeviLamina supports, with LeviLamina, in a new workspace
      # (lip install LeviLamina is carried out as lip setup), runs the server with lip run until
      # it has started, asks it to stop, and fails unless LeviLamina was loaded, the server
      # started, and lip run exited with 0.
      - shell: bash
        run: |
          # Without -e: the checks below say how lip run failed.
          set +e -uo pipefail

          lip=$PWD/bin/lip
          workspace=$(mktemp -d)
          cd "$workspace" || exit 1

          "$lip" install github.com/LiteLDev/LeviLamina --accept-eula || exit 1

          : > server.log
          # Writes the line stop once the server has started or exited, or after ten minutes.
          feed() {
            for ((i = 0; i < 600; i++)); do
              if grep -q 'Server started' server.log || [ -e exited ]; then
                break
              fi
              sleep 1
            done
            echo stop
          }
          "$lip" run < <(feed) 2>&1 | tee server.log
          code=${PIPESTATUS[0]}
          touch exited

          if ! grep -q 'LeviLamina Loaded' server.log; then
            echo "::error::LeviLamina was not loaded (lip run exited with $code)."
            exit 1
          fi
          if ! grep -q 'Server started' server.log; then
            echo "::error::The server did not start (lip run exited with $code)."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::The server started, but lip run exited with $code."
            exit 1
          fi

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ${{ matrix.runs-on }}
    # The tests take minutes. A test that never ends must not hold a runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-24.04-arm
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-11-arm
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      # When no test ends within ten minutes, the tests that were running are named and the
      # job fails.
      - run: dotnet test --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none

  # Installs the latest release of lip with install.sh, as curl -fsSL .../install.sh | sh does,
  # without changing PATH, and runs it.
  install:
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7

      - run: |
          dir=$(mktemp -d)
          LIP_INSTALL_DIR="$dir" LIP_NO_MODIFY_PATH=1 sh install.sh < /dev/null
          "$dir/lip" -v

  # The single check that the ruleset of main requires: it fails unless every job above
  # succeeded or was skipped as the change does not need it, so the ruleset need not name each
  # job of each matrix. A job is skipped otherwise only when a job it needs failed, which fails
  # this check too.
  ci-ok:
    needs: [changes, build, install, lint, server, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Not every job succeeded."
          exit 1
