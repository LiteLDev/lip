# Pushing a tag like v1.2.3 releases it: the newest stable version becomes Latest on GitHub, npm and winget, a bugfix
# of an older line goes to npm under release-X.Y, and a prerelease like v1.2.3-beta.1 goes to npm under its
# identifier (beta).
on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      npm-tag: ${{ steps.plan.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: plan
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            channel=prerelease
            npm_tag="${version#*-}"
            npm_tag="${npm_tag%%.*}"
          elif [[ "$(git tag --list 'v*' | grep -vF -- - | sort -V | tail -1)" == "$GITHUB_REF_NAME" ]]; then
            channel=latest
            npm_tag=latest
          else
            channel=maintenance
            npm_tag="release-${version%.*}"
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "npm-tag=$npm_tag"
          } >> "$GITHUB_OUTPUT"

      # The notes list the pull requests since the newest stable release the tag contains.
      - run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ${{ matrix.runs-on }}
    needs:
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-arm64
            runs-on: ubuntu-24.04-arm
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - shell: bash
        run: |
          dotnet publish src/Lip.Cli \
            -o bin \
            -r ${{ matrix.runtime }} \
            --no-self-contained \
            -p:DebugType=embedded \
            -p:Version=${{ needs.create-release.outputs.version }}

      - shell: bash
        run: |
          dotnet publish src/Lip.Daemon \
            -o bin \
            -r ${{ matrix.runtime }} \
            --no-self-contained \
            -p:DebugType=embedded \
            -p:Version=${{ needs.create-release.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}
          path: bin/

  create-portable-archives:
    runs-on: ubuntu-latest
    needs:
      - build
      - create-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - linux-arm64
          - linux-x64
          - osx-arm64
          - osx-x64
          - win-arm64
          - win-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}
          path: .tmp

      - if: startsWith(matrix.runtime, 'linux-')
        run: |
          tar -cJvf "lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}.tar.xz" -C .tmp .

      - if: ${{ !startsWith(matrix.runtime, 'linux-') }}
        working-directory: .tmp
        run: |
          zip -r9 "../lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}.zip" *

      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.runtime }}
          path: lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}.*

  create-windows-installers:
    runs-on: ${{ matrix.runs-on }}
    needs:
      - build
      - create-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-arm64
            runs-on: windows-11-arm
            build-arch: arm64
          - runtime: win-x64
            runs-on: windows-latest
            build-arch: x64compatible
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}
          path: .tmp/artifacts

      - shell: bash
        run: |
          mkdir -p .tmp/inno

      - uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: inno/lip.iss
          options: |
            /DAppVersion=${{ needs.create-release.outputs.version }}
            /DBuildArch=${{ matrix.build-arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.runtime }}-installers
          path: .tmp/inno/lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}-setup.exe

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - create-portable-archives
      - create-windows-installers
      - create-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          path: .tmp/assets
          merge-multiple: true

      - run: |
          gh release upload "$GITHUB_REF_NAME" .tmp/assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - run: |
          case '${{ needs.create-release.outputs.channel }}' in
            prerelease) flags=(--prerelease) ;;
            latest) flags=(--latest) ;;
            *) flags=(--latest=false) ;;
          esac
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

  publish-npm:
    runs-on: ubuntu-latest
    needs:
      - build
      - create-release
      - publish-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          pattern: lip-${{ needs.create-release.outputs.version }}-*
          path: .tmp/artifacts

      - run: |
          cp -R npm/. .tmp/npm/

      - run: |
          chmod +x .tmp/npm/lip.js .tmp/npm/lipd.js

      - run: |
          node -e '
            const fs = require("node:fs");
            const file = ".tmp/npm/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = "${{ needs.create-release.outputs.version }}";
            fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          '

      - run: |
          for target in \
            "linux-x64:linux-x64:lip:lipd" \
            "linux-arm64:linux-arm64:lip:lipd" \
            "osx-x64:darwin-x64:lip:lipd" \
            "osx-arm64:darwin-arm64:lip:lipd" \
            "win-x64:win32-x64:lip.exe:lipd.exe" \
            "win-arm64:win32-arm64:lip.exe:lipd.exe"
          do
            IFS=: read -r runtime npm_dir cli_binary daemon_binary <<< "$target"
            mkdir -p ".tmp/npm/$npm_dir"
            cp ".tmp/artifacts/lip-${{ needs.create-release.outputs.version }}-$runtime/$cli_binary" ".tmp/npm/$npm_dir/$cli_binary"
            cp ".tmp/artifacts/lip-${{ needs.create-release.outputs.version }}-$runtime/$daemon_binary" ".tmp/npm/$npm_dir/$daemon_binary"
            if [[ "$cli_binary" != *.exe ]]; then
              chmod +x ".tmp/npm/$npm_dir/$cli_binary" ".tmp/npm/$npm_dir/$daemon_binary"
            fi
          done

      - run: |
          npm publish .tmp/npm --tag '${{ needs.create-release.outputs.npm-tag }}'

  publish-winget:
    if: needs.create-release.outputs.channel == 'latest'
    needs:
      - create-release
      - publish-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - run: gh repo sync lip-winget-bot/winget-pkgs -b master
        env:
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}

      - run: |
          $arm64Url = "https://github.com/LiteLDev/lip/releases/download/v${{ needs.create-release.outputs.version }}/lip-${{ needs.create-release.outputs.version }}-win-arm64.zip"
          $x64Url = "https://github.com/LiteLDev/lip/releases/download/v${{ needs.create-release.outputs.version }}/lip-${{ needs.create-release.outputs.version }}-win-x64.zip"

          curl -JLO https://aka.ms/wingetcreate/latest
          .\wingetcreate.exe update levimc.lip `
            --submit `
            --urls "$arm64Url" "$x64Url" `
            --version "${{ needs.create-release.outputs.version }}" 
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
