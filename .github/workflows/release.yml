# Pushing a tag like v1.2.3 releases it: the newest stable version becomes Latest on GitHub and winget, and a
# prerelease like v1.2.3-beta.1 is marked as a prerelease on GitHub.
on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: plan
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            channel=prerelease
          elif [[ "$(git tag --list 'v*' | grep -vF -- - | sort -V | tail -1)" == "$GITHUB_REF_NAME" ]]; then
            channel=latest
          else
            channel=maintenance
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      # The notes list the pull requests since the newest stable release the tag contains.
      - run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ${{ matrix.runs-on }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-arm64
            runs-on: ubuntu-24.04-arm
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - shell: bash
        run: |
          dotnet publish src/Lip.Cli \
            -o bin \
            -r ${{ matrix.runtime }} \
            --no-self-contained \
            -p:DebugType=embedded \
            -p:Version=${{ needs.create-release.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}
          path: bin/

  create-portable-archives:
    runs-on: ubuntu-latest
    needs:
      - build
      - create-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - linux-arm64
          - linux-x64
          - osx-arm64
          - osx-x64
          - win-arm64
          - win-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}
          path: .tmp

      - if: startsWith(matrix.runtime, 'linux-')
        run: |
          tar -cJvf "lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}.tar.xz" -C .tmp .

      - if: ${{ !startsWith(matrix.runtime, 'linux-') }}
        working-directory: .tmp
        run: |
          zip -r9 "../lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}.zip" *

      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.runtime }}
          path: lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}.*

  create-windows-installers:
    runs-on: ${{ matrix.runs-on }}
    needs:
      - build
      - create-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-arm64
            runs-on: windows-11-arm
            arch: arm64
          - runtime: win-x64
            runs-on: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - uses: actions/download-artifact@v8
        with:
          name: lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}
          path: .tmp/artifacts

      - run: |
          ./packaging/wix/build.ps1 `
            -Version ${{ needs.create-release.outputs.version }} `
            -Arch ${{ matrix.arch }} `
            -BinDir .tmp/artifacts `
            -OutDir .tmp/wix

      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.runtime }}-installers
          path: |
            .tmp/wix/lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}.msi
            .tmp/wix/lip-${{ needs.create-release.outputs.version }}-${{ matrix.runtime }}-setup.exe

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - create-portable-archives
      - create-windows-installers
      - create-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          path: .tmp/assets
          merge-multiple: true

      - run: |
          gh release upload "$GITHUB_REF_NAME" .tmp/assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - run: |
          case '${{ needs.create-release.outputs.channel }}' in
            prerelease) flags=(--prerelease) ;;
            latest) flags=(--latest) ;;
            *) flags=(--latest=false) ;;
          esac
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

  publish-winget:
    if: needs.create-release.outputs.channel == 'latest'
    needs:
      - create-release
      - publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: levimc.lip
          installers-regex: '-win-(x64|arm64)\.zip$'
          release-tag: ${{ github.ref_name }}
          fork-user: lip-winget-bot
          token: ${{ secrets.WINGET_TOKEN }}
