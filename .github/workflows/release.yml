on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to build and publish (e.g. v1.2.3)
        required: true

concurrency:
  group: release-${{ inputs.tag }}

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.VERSION }}
    steps:
      - id: get-version
        shell: bash
        run: |
          echo "VERSION=$(echo '${{ inputs.tag }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ${{ matrix.runs-on }}
    needs:
      - get-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-arm64
            runs-on: ubuntu-24.04-arm
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - shell: bash
        run: |
          dotnet publish src/Lip.Cli \
            -o bin \
            -r ${{ matrix.runtime }} \
            --no-self-contained \
            -p:DebugType=embedded \
            -p:Version=${{ needs.get-version.outputs.version }}

      - shell: bash
        run: |
          dotnet publish src/Lip.Daemon \
            -o bin \
            -r ${{ matrix.runtime }} \
            --no-self-contained \
            -p:DebugType=embedded \
            -p:Version=${{ needs.get-version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: lip-${{ needs.get-version.outputs.version }}-${{ matrix.runtime }}
          path: bin/

  create-portable-archives:
    runs-on: ubuntu-latest
    needs:
      - build
      - get-version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - linux-arm64
          - linux-x64
          - osx-arm64
          - osx-x64
          - win-arm64
          - win-x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          name: lip-${{ needs.get-version.outputs.version }}-${{ matrix.runtime }}
          path: .tmp

      - if: startsWith(matrix.runtime, 'linux-')
        run: |
          tar -cJvf "lip-${{ needs.get-version.outputs.version }}-${{ matrix.runtime }}.tar.xz" -C .tmp .

      - if: ${{ !startsWith(matrix.runtime, 'linux-') }}
        working-directory: .tmp
        run: |
          zip -r9 "../lip-${{ needs.get-version.outputs.version }}-${{ matrix.runtime }}.zip" *

      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.runtime }}
          path: lip-${{ needs.get-version.outputs.version }}-${{ matrix.runtime }}.*

  create-windows-installers:
    runs-on: ${{ matrix.runs-on }}
    needs:
      - build
      - get-version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-arm64
            runs-on: windows-11-arm
            arch: arm64
          - runtime: win-x64
            runs-on: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - uses: actions/download-artifact@v8
        with:
          name: lip-${{ needs.get-version.outputs.version }}-${{ matrix.runtime }}
          path: .tmp/artifacts

      - run: |
          ./wix/build.ps1 `
            -Version ${{ needs.get-version.outputs.version }} `
            -Arch ${{ matrix.arch }} `
            -BinDir .tmp/artifacts `
            -OutDir .tmp/wix

      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.runtime }}-installers
          path: |
            .tmp/wix/lip-${{ needs.get-version.outputs.version }}-${{ matrix.runtime }}.msi
            .tmp/wix/lip-${{ needs.get-version.outputs.version }}-${{ matrix.runtime }}-setup.exe

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - create-portable-archives
      - create-windows-installers
      - get-version
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          path: .tmp/assets
          merge-multiple: true

      - run: |
          gh release upload '${{ inputs.tag }}' .tmp/assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - if: contains(needs.get-version.outputs.version, '-')
        run: |
          gh release edit '${{ inputs.tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - if: ${{ !contains(needs.get-version.outputs.version, '-') }}
        run: |
          gh release edit '${{ inputs.tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

  publish-npm:
    runs-on: ubuntu-latest
    needs:
      - build
      - get-version
      - publish-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          pattern: lip-${{ needs.get-version.outputs.version }}-*
          path: .tmp/artifacts

      - run: |
          cp -R npm/. .tmp/npm/

      - run: |
          chmod +x .tmp/npm/lip.js .tmp/npm/lipd.js

      - run: |
          node -e '
            const fs = require("node:fs");
            const file = ".tmp/npm/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = "${{ needs.get-version.outputs.version }}";
            fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          '

      - run: |
          for target in \
            "linux-x64:linux-x64:lip:lipd" \
            "linux-arm64:linux-arm64:lip:lipd" \
            "osx-x64:darwin-x64:lip:lipd" \
            "osx-arm64:darwin-arm64:lip:lipd" \
            "win-x64:win32-x64:lip.exe:lipd.exe" \
            "win-arm64:win32-arm64:lip.exe:lipd.exe"
          do
            IFS=: read -r runtime npm_dir cli_binary daemon_binary <<< "$target"
            mkdir -p ".tmp/npm/$npm_dir"
            cp ".tmp/artifacts/lip-${{ needs.get-version.outputs.version }}-$runtime/$cli_binary" ".tmp/npm/$npm_dir/$cli_binary"
            cp ".tmp/artifacts/lip-${{ needs.get-version.outputs.version }}-$runtime/$daemon_binary" ".tmp/npm/$npm_dir/$daemon_binary"
            if [[ "$cli_binary" != *.exe ]]; then
              chmod +x ".tmp/npm/$npm_dir/$cli_binary" ".tmp/npm/$npm_dir/$daemon_binary"
            fi
          done

      - if: contains(needs.get-version.outputs.version, '-')
        run: |
          version='${{ needs.get-version.outputs.version }}'
          tag="${version#*-}"
          tag="${tag%%.*}"
          npm publish .tmp/npm --tag "$tag"

      - if: ${{ !contains(needs.get-version.outputs.version, '-') }}
        run: |
          npm publish .tmp/npm

  publish-winget:
    needs:
      - get-version
      - publish-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
  
      - run: gh repo sync lip-winget-bot/winget-pkgs -b master
        env:
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}

      - run: |
          $arm64Url = "https://github.com/LiteLDev/lip/releases/download/v${{ needs.get-version.outputs.version }}/lip-${{ needs.get-version.outputs.version }}-win-arm64.zip"
          $x64Url = "https://github.com/LiteLDev/lip/releases/download/v${{ needs.get-version.outputs.version }}/lip-${{ needs.get-version.outputs.version }}-win-x64.zip"

          curl -JLO https://aka.ms/wingetcreate/latest
          .\wingetcreate.exe update levimc.lip `
            --submit `
            --urls "$arm64Url" "$x64Url" `
            --version "${{ needs.get-version.outputs.version }}" 
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}