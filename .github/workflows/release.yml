# Pushing a tag like v1.2.3 releases it once every asset is built: the newest stable version becomes Latest on
# GitHub, and a prerelease like v1.2.3-beta.1 is marked as a prerelease on GitHub.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-arm64
            runs-on: ubuntu-24.04-arm
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NAME=lip-${GITHUB_REF_NAME#v}-${{ matrix.runtime }}" >> "$GITHUB_ENV"

      - shell: bash
        run: |
          dotnet publish src/Lip.Cli \
            -o bin \
            -r ${{ matrix.runtime }} \
            --no-self-contained \
            -p:DebugType=embedded \
            -p:Version="$VERSION"
          mkdir dist

      - if: runner.os == 'Linux'
        run: tar -cJf "dist/$NAME.tar.xz" -C bin .

      - if: runner.os == 'macOS'
        working-directory: bin
        run: zip -r9 "../dist/$NAME.zip" .

      - if: runner.os == 'Windows'
        run: |
          Compress-Archive bin/* "dist/$env:NAME.zip"
          ./packaging/wix/build.ps1 `
            -Version $env:VERSION `
            -Arch ('${{ matrix.runtime }}' -replace '^win-') `
            -BinDir bin `
            -OutDir dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The notes list the pull requests since the newest stable release below the tag's version, which
      # need not be an ancestor of the tag (v0.37.0 was released from a rollback branch).
      - run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags=(--prerelease)
          elif [[ "$(git tag --list 'v*' | grep -vF -- - | sort -V | tail -1)" == "$GITHUB_REF_NAME" ]]; then
            flags=(--latest)
          else
            flags=(--latest=false)
          fi
          base="${GITHUB_REF_NAME%%-*}"
          previous=$({ git tag --list 'v*' | grep -vF -- - | grep -vxF "$base"; echo "$base"; } \
            | sort -V | grep -B1 -xF "$base" | grep -vxF "$base" || true)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"} \
            "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
