on:
  pull_request:
    paths: &paths
      - .github/workflows/build.yml
      - 'src/**'
      - 'tests/**'
  push:
    branches:
      - main
      - 'release/**'
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-arm64
            runs-on: ubuntu-24.04-arm
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - run: dotnet publish src/Lip.Cli -o bin -r ${{ matrix.runtime }} --no-self-contained -p:DebugType=embedded

      - uses: actions/upload-artifact@v7
        with:
          name: lip-${{ github.sha }}-${{ matrix.runtime }}
          path: bin/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - run: dotnet format --verify-no-changes

      # Code style and the .NET analyzers at build time, with every warning failing the build.
      - run: dotnet build -warnaserror -p:EnforceCodeStyleInBuild=true

  test:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-24.04-arm
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-11-arm
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - run: dotnet test
