on:
  # Pull requests and the merge queue always run this workflow, so build-result can be a required check; the jobs
  # skip themselves when no build input changed.
  pull_request:
  merge_group:
  # Other branches build through their pull request, so a pull request does not report build-result twice.
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - .github/workflows/build.yml
      - 'src/**'
      - 'tests/**'
      - 'packaging/wix/**'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: changes
        run: |
          case "$EVENT" in
            pull_request)
              # The checked-out merge commit's first parent is the tip of the base branch.
              base=HEAD^1
              ;;
            merge_group)
              git fetch --depth=1 origin "$MERGE_GROUP_BASE"
              base="$MERGE_GROUP_BASE"
              ;;
            *)
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if git diff --name-only "$base" HEAD | grep -qE '^(\.github/workflows/build\.yml|src/|tests/|packaging/wix/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-arm64
            runs-on: ubuntu-24.04-arm
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - shell: bash
        run: |
          dotnet publish src/Lip.Cli \
            -o bin \
            -r ${{ matrix.runtime }} \
            --no-self-contained \
            -p:DebugType=embedded

      - shell: bash
        run: |
          dotnet publish src/Lip.Daemon \
            -o bin \
            -r ${{ matrix.runtime }} \
            --no-self-contained \
            -p:DebugType=embedded

      - uses: actions/upload-artifact@v7
        with:
          name: lip-${{ github.sha }}-${{ matrix.runtime }}
          path: bin/

  check-style:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - run: |
          dotnet format \
            --verify-no-changes

  test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-24.04-arm
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-11-arm
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - run: |
          dotnet test

  test-windows-installer:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: windows-11-arm
          - arch: x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - shell: bash
        run: |
          dotnet publish src/Lip.Cli \
            -o .tmp/artifacts \
            -r win-${{ matrix.arch }} \
            --no-self-contained \
            -p:DebugType=embedded

      - shell: bash
        run: |
          dotnet publish src/Lip.Daemon \
            -o .tmp/artifacts \
            -r win-${{ matrix.arch }} \
            --no-self-contained \
            -p:DebugType=embedded

      - run: |
          ./packaging/wix/build.ps1 -Version 0.0.1 -Arch ${{ matrix.arch }} -BinDir .tmp/artifacts -OutDir .tmp/wix
          ./packaging/wix/build.ps1 -Version 0.0.2 -Arch ${{ matrix.arch }} -BinDir .tmp/artifacts -OutDir .tmp/wix

      # The last version released with the former Inno Setup installer.
      - run: |
          gh release download v0.35.0 `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern "lip-0.35.0-win-${{ matrix.arch }}-setup.exe" `
            --dir .tmp/inno
        env:
          GH_TOKEN: ${{ github.token }}

      - run: |
          ./packaging/wix/test.ps1 `
            -ArtifactsDir .tmp/wix `
            -Arch ${{ matrix.arch }} `
            -InnoSetup .tmp/inno/lip-0.35.0-win-${{ matrix.arch }}-setup.exe

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-logs-${{ matrix.arch }}
          path: .tmp/wix/logs/

  # A clean Windows Server Core, where setup.exe has to install the .NET runtime itself.
  test-windows-installer-server-core:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - shell: bash
        run: |
          dotnet publish src/Lip.Cli \
            -o .tmp/artifacts \
            -r win-x64 \
            --no-self-contained \
            -p:DebugType=embedded

      - shell: bash
        run: |
          dotnet publish src/Lip.Daemon \
            -o .tmp/artifacts \
            -r win-x64 \
            --no-self-contained \
            -p:DebugType=embedded

      - run: |
          ./packaging/wix/build.ps1 -Version 0.0.1 -Arch x64 -BinDir .tmp/artifacts -OutDir .tmp/wix
          ./packaging/wix/build.ps1 -Version 0.0.2 -Arch x64 -BinDir .tmp/artifacts -OutDir .tmp/wix

      # Some runners start without the Docker engine running.
      - run: |
          $service = Get-Service docker
          Write-Output "Docker service: $($service.Status)"
          if ($service.Status -ne 'Running') {
            Start-Service docker
            $service.WaitForStatus('Running', '00:02:00')
          }
          docker version

      - run: |
          docker run --rm `
            -v "${{ github.workspace }}:C:\lip" `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -Command `
            "`$ErrorActionPreference = 'Stop'; & C:\lip\packaging\wix\test.ps1 -ArtifactsDir C:\lip\.tmp\wix -Arch x64 -Scenario Bundle; & C:\lip\packaging\wix\test.ps1 -ArtifactsDir C:\lip\.tmp\wix -Arch x64 -Scenario Msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-logs-server-core
          path: .tmp/wix/logs/

  # The required check: fails when any job failed or was cancelled, passes when they passed or had nothing to build.
  build-result:
    if: always()
    needs:
      - build
      - changes
      - check-style
      - test
      - test-windows-installer
      - test-windows-installer-server-core
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          exit 1
