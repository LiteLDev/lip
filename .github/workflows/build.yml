on:
  pull_request:
    paths: &paths
      - .github/scripts/**
      - .github/workflows/build.yml
      - 'src/**'
      - 'tests/**'
  push:
    branches:
      - main
      - 'release/**'
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # lip is not built for Linux on arm64: no Wine there runs a LeviLamina server (see the
  # job server).
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      # Self-contained: lip needs no .NET runtime where it runs.
      - run: dotnet publish src/Lip.Cli -o bin -r ${{ matrix.runtime }} --self-contained -p:DebugType=embedded

      # The tests that run lip as a program, with the lip published above: trimmed, as released.
      - shell: bash
        run: |
          dir=$(cd bin && { pwd -W 2>/dev/null || pwd; })
          LIP_TEST_EXECUTABLE="$dir/$(ls bin | grep -E '^lip(\.exe)?$')" \
            dotnet test tests/Lip.Cli.Tests --filter FullyQualifiedName~UsageErrorTests

      - uses: actions/upload-artifact@v7
        with:
          name: lip-${{ github.sha }}-${{ matrix.runtime }}
          path: bin/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - run: dotnet format --verify-no-changes

      # Code style and the .NET analyzers at build time, with every warning failing the build.
      - run: dotnet build -warnaserror -p:EnforceCodeStyleInBuild=true

  # Installs LeviLamina and runs the real server with the lip that was built, on every system
  # lip is released for. Where the system is not Windows, the Wine that lip installs runs the
  # server.
  #
  # Linux on arm64 is not among them. There, Hangover runs the server of Minecraft, but not the
  # one LeviLamina has modified; the Wine for x64 loses the exit codes of Windows programs under
  # box64, and under FEX ran a LeviLamina server in two of six attempts: PeEditor.exe was killed
  # in two, and the server failed as it stopped in two.
  server:
    needs: build
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runs-on: ubuntu-latest
          - runtime: osx-arm64
            runs-on: macos-latest
          - runtime: osx-x64
            runs-on: macos-15-intel
          - runtime: win-arm64
            runs-on: windows-11-arm
          - runtime: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lip-${{ github.sha }}-${{ matrix.runtime }}
          path: bin

      # lip installs Wine and the Visual C++ runtime itself. Wine for macOS is built for x64 only:
      # Rosetta runs it, which lip does not install, since that needs an administrator.
      - if: matrix.runtime == 'osx-arm64'
        run: softwareupdate --install-rosetta --agree-to-license

      - shell: bash
        run: |
          chmod +x bin/lip* || true
          bash .github/scripts/real-server.sh "$PWD/bin/lip"

  test:
    runs-on: ${{ matrix.runs-on }}
    # The tests take minutes. A test that never ends must not hold a runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-24.04-arm
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-11-arm
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      # When no test ends within ten minutes, the tests that were running are named and the
      # job fails.
      - run: dotnet test --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none
