name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true

  - type: input
    attributes:
      label: Version and platform
      description: e.g. lip 0.37.0 on Windows 11
